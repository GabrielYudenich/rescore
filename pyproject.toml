[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescore"
version = "0.1.0"
description = "Pipeline local de OMR para converter partituras PDF em MusicXML e MuseScore."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
  { name = "ReScore contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "opencv-python-headless>=4.10,<5",
  "cryptography>=45,<47",
]

[project.optional-dependencies]
hub = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]
hub-dev = [
  "httpx>=0.28,<1",
]

[project.scripts]
rescore = "rescore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
